<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mentorship — Professor</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; background: #f1f1f1; color: #222; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #fff;
            border-radius: 0 0 12px 12px;
        }
        .tag { color: #666; font-size: 11px; letter-spacing: 1px; }
        .project-title { margin-top: 3px; font-size: 18px; font-weight: 700; }
        main { width: min(920px, 100%); margin: 0 auto; padding: 24px; }
        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        h1 { font-size: 22px; }
        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #292929;
            color: #fff;
            cursor: pointer;
        }
        button:disabled { cursor: wait; opacity: .6; }
        #message { min-height: 24px; margin: 12px 0; color: #444; }
        #feed { display: grid; gap: 14px; }
        .card { padding: 16px; background: #fff; border: 1px solid #ccc; border-radius: 10px; }
        .card-meta { display: flex; justify-content: space-between; gap: 12px; color: #555; font-size: 13px; }
        .status { font-weight: 700; }
        .question-content { margin: 14px 0; white-space: pre-wrap; }
        .previous-answer {
            margin: 12px 0;
            padding: 12px;
            border-left: 3px solid #4b7f52;
            background: #f4f8f4;
            white-space: pre-wrap;
        }
        .answer-form { display: grid; gap: 8px; }
        .answer-form label { font-weight: 700; }
        .answer-form textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
        }
        .answer-form button { justify-self: start; }
        @media (max-width: 560px) {
            main { padding: 16px; }
            .page-heading { align-items: flex-start; flex-direction: column; }
            .card-meta { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="tag">HACKATHON</div>
            <div class="project-title">Smart Mentorship</div>
        </div>
        <div id="teacher-name"></div>
    </header>

    <main>
        <div class="page-heading">
            <h1>Perguntas dos estudantes</h1>
            <button type="button" id="refresh-questions">Atualizar perguntas</button>
        </div>
        <p id="message" aria-live="polite"></p>
        <section id="feed" aria-label="Lista de perguntas"></section>
    </main>

    <script>
        const API_URL = 'http://localhost:8080/api/questions';
        const feed = document.getElementById('feed');
        const message = document.getElementById('message');

        const currentUser = JSON.parse(localStorage.getItem('loggedUser') || 'null');
        if (currentUser?.name) {
            document.getElementById('teacher-name').textContent = currentUser.name;
        }

        function createQuestionCard(question) {
            const card = document.createElement('article');
            card.className = 'card';

            const meta = document.createElement('div');
            meta.className = 'card-meta';
            const author = document.createElement('span');
            author.textContent = `Pergunta #${question.id} • ${question.author?.name || 'Anônimo'}`;
            const status = document.createElement('span');
            status.className = 'status';
            status.textContent = question.status || 'Pendente';
            meta.append(author, status);

            const content = document.createElement('p');
            content.className = 'question-content';
            content.textContent = question.content;
            card.append(meta, content);

            if (question.answer) {
                const previousAnswer = document.createElement('div');
                previousAnswer.className = 'previous-answer';
                previousAnswer.textContent = `Resposta atual: ${question.answer}`;
                card.append(previousAnswer);
            }

            const form = document.createElement('form');
            form.className = 'answer-form';
            const label = document.createElement('label');
            label.textContent = question.answer ? 'Editar resposta' : 'Sua resposta';
            const textarea = document.createElement('textarea');
            textarea.required = true;
            textarea.maxLength = 2000;
            textarea.value = question.answer || '';
            textarea.placeholder = 'Escreva uma resposta para o estudante...';
            const submit = document.createElement('button');
            submit.type = 'submit';
            submit.textContent = question.answer ? 'Atualizar resposta' : 'Enviar resposta';
            form.append(label, textarea, submit);
            card.append(form);

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                const answer = textarea.value.trim();
                if (!answer) {
                    message.textContent = 'Digite uma resposta antes de enviar.';
                    return;
                }

                submit.disabled = true;
                message.textContent = 'Salvando resposta...';
                try {
                    const response = await fetch(`${API_URL}/${question.id}/answer`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ answer })
                    });

                    if (!response.ok) {
                        message.textContent = response.status === 404
                            ? 'Essa pergunta não foi encontrada.'
                            : 'Não foi possível salvar a resposta.';
                        return;
                    }

                    await loadQuestions();
                    message.textContent = 'Resposta salva. A pergunta agora está como Respondida.';
                } catch (error) {
                    message.textContent = 'Não foi possível conectar ao servidor. A resposta não foi salva.';
                } finally {
                    submit.disabled = false;
                }
            });

            return card;
        }

        function renderQuestions(questions) {
            feed.replaceChildren();
            if (!questions.length) {
                feed.textContent = 'Ainda não há perguntas.';
                return;
            }
            questions.forEach(question => feed.append(createQuestionCard(question)));
        }

        async function loadQuestions() {
            message.textContent = 'Carregando perguntas...';
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    message.textContent = 'Não foi possível carregar as perguntas.';
                    return;
                }
                renderQuestions(await response.json());
                message.textContent = '';
            } catch (error) {
                message.textContent = 'Não foi possível conectar ao servidor. Verifique se o back-end está ativo.';
            }
        }

        document.getElementById('refresh-questions').addEventListener('click', loadQuestions);
        loadQuestions();
    </script>
</body>
</html>
