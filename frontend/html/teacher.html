<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mentorship — Professor</title>
    <link rel="stylesheet" href="../css/teacher.css">
</head>
<body>
    <header>
        <div>
            <div class="tag">HACKATHON</div>
            <div class="project-title">Smart Mentorship</div>
        </div>
        <div id="teacher-name" aria-label="Monitor conectado"></div>
    </header>

    <main>
        <div class="page-heading">
            <div>
                <h1>Perguntas dos estudantes</h1>
                <p>Revise as dúvidas e publique respostas quando estiverem prontas.</p>
            </div>
            <button type="button" id="refresh-questions">Atualizar perguntas</button>
        </div>
        <p id="message" aria-live="polite" role="status"></p>
        <section id="feed" aria-label="Lista de perguntas"></section>
    </main>

    <script src="../js/teacher.js"></script>
</body>
</html>
